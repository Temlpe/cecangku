name: Steam爬虫定时任务

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    environment: env  # 替换为你的Environment名称（如production）
    steps:
      - name: 拉取代码
        run: git clone https://github.com/${{ github.repository }}.git . && cd $(basename ${{ github.repository }})

      - name: 查看文件列表
        run: ls -la

      - name: 安装Python和依赖
        run: |
          sudo apt update
          sudo apt install -y python3.10 python3.10-pip
          python3.10 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行爬虫脚本
        env:
          # 直接引用Environment中的Secrets（名称需完全匹配）
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python3.10 steam_crawler.py  # 替换为你的脚本名
