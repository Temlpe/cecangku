name: Steam爬虫循环任务

# 触发机制：手动触发 + API调度触发
on:
  workflow_dispatch:  # 允许手动触发
  repository_dispatch:  # 用于API触发循环
    types: [crawl_again]  # 自定义事件类型，匹配API调用的类型

jobs:
  crawl:
    runs-on: ubuntu-latest
    environment: env  # 替换为你的环境名称
    timeout-minutes: 360  # 设置超时（避免无限挂起，根据爬虫时长调整）
    steps:
      - name: 拉取代码仓库
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # 匹配你的爬虫Python版本
          cache: 'pip'  # 缓存依赖，加速安装

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行Steam爬虫脚本
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python steam_crawler.py  # 替换为你的爬虫脚本名

      - name: 延迟1小时后触发下一次爬取
        if: always()  # 无论前面步骤成功/失败，都触发下一次（可选改为success()仅成功后触发）
        env:
          PAT_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}  # 需提前配置PAT
          REPO_FULL_NAME: ${{ github.repository }}  # 仓库全名（如：用户名/仓库名）
          EVENT_TYPE: crawl_again  # 匹配on.repository_dispatch.types
        run: |
          echo "当前任务完成，等待1小时后触发下一次爬取..."
          sleep 3600  # 延迟1小时（3600秒）
          
          # 调用GitHub API触发repository_dispatch事件
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$REPO_FULL_NAME/dispatches \
            -d "{\"event_type\":\"$EVENT_TYPE\", \"client_payload\":{\"ref\":\"${{ github.ref }}\"}}"
          
          echo "已触发下一次爬取任务"
