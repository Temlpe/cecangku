name: Steam爬虫定时任务

on:
  schedule:
    # 每天UTC时间0点运行（对应北京时间8点）
    - cron: '0 */1 * * *'  # 每小时0分触发（UTC）
  workflow_dispatch:  # 允许手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest  # 运行环境为Ubuntu
    environment: env  # 替换为你的Environment名称（如production）
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # 匹配你的Python版本

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行爬虫脚本
        env:
          # 注入Secrets为环境变量
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python steam_crawler.py  # 替换为你的爬虫脚本文件名（如main.py）

