name: Steam爬虫定时任务

on:
  schedule:
    - cron: '0 */2 * * *'  
  workflow_dispatch:  # 允许手动触发

# 关键：控制并发执行
concurrency:
  group: steam-crawler-group  # 自定义固定组名（确保唯一）
  cancel-in-progress: false    # 若有正在运行的任务，取消旧任务并启动新任务（或设为false让新任务排队）

jobs:
  crawl:
    runs-on: ubuntu-latest  # 运行环境为Ubuntu
    environment: env  # 替换为你的Environment名称（如production）
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # 匹配你的Python版本

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行爬虫脚本
        env:
          # 注入Secrets为环境变量
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python steam_crawler.py  # 替换为你的爬虫脚本文件名（如main.py）
